syntax = "proto3";

package locatedo.category.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

service CategoryService {
  rpc PutCategory(PutCategoryRequest) returns (PutCategoryResponse);
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse);
}

enum BuiltinCategory {
  // A category the user created.
  BUILTIN_CATEGORY_UNSPECIFIED = 0;
  BUILTIN_CATEGORY_SHOPPING = 1;
  BUILTIN_CATEGORY_WORK = 2;
  BUILTIN_CATEGORY_LIFE = 3;
  BUILTIN_CATEGORY_OTHER = 4;
}

message Category {
  string id = 1;
  string household_id = 2;
  BuiltinCategory builtin = 3;
  // Unset for a built-in that keeps its localized name.
  optional string name = 4;
  string icon = 5;
  string color = 6;
  int32 sort_order = 7;
  google.protobuf.Timestamp updated_at = 8;
  int64 version = 9;
}

message CategoryInput {
  string id = 1 [(buf.validate.field).string.uuid = true];
  BuiltinCategory builtin = 2 [(buf.validate.field).enum.defined_only = true];
  optional string name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50
  }];
  // Keys defined by the apps (e.g., "cart", "green"); each platform maps them to
  // its own symbols and light/dark colors.
  string icon = 4 [(buf.validate.field).string = {
    max_len: 50
    pattern: "^[a-z][a-z0-9_]*$"
  }];
  string color = 5 [(buf.validate.field).string = {
    max_len: 50
    pattern: "^[a-z][a-z0-9_]*$"
  }];
  int32 sort_order = 6;

  option (buf.validate.message).cel = {
    id: "category_input.name_required"
    message: "a user-created category needs a name"
    expression: "this.builtin != 0 || has(this.name)"
  };
}

message PutCategoryRequest {
  string household_id = 1 [(buf.validate.field).string.uuid = true];
  CategoryInput category = 2 [(buf.validate.field).required = true];
}

message PutCategoryResponse {}

message DeleteCategoryRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteCategoryResponse {}
