syntax = "proto3";

package locatedo.device.v1;

import "buf/validate/validate.proto";

service DeviceService {
  // The access token is optional. Without one the device is registered
  // anonymously, and the server keeps it only while promotions_consent is on.
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);
}

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_IOS = 1;
  PLATFORM_ANDROID = 2;
}

enum ApnsEnvironment {
  APNS_ENVIRONMENT_UNSPECIFIED = 0;
  APNS_ENVIRONMENT_SANDBOX = 1;
  APNS_ENVIRONMENT_PRODUCTION = 2;
}

message RegisterDeviceRequest {
  Platform platform = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // What the push service targets: the APNs device token on iOS, the Firebase
  // installation ID on Android.
  string push_token = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
  ApnsEnvironment apns_environment = 3 [(buf.validate.field).enum.defined_only = true];
  bool promotions_consent = 4;
  string language = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "en",
        "ja"
      ]
    }
  ];

  // Whether to be told when a household member checks off a to-do the user
  // added. Unset leaves the device's setting as it is (on for a new device).
  optional bool completion_notices = 6;

  option (buf.validate.message).cel = {
    id: "register_device_request.apns_environment"
    message: "apns_environment is required on iOS and not allowed on Android"
    expression: "(this.platform == 1) == (this.apns_environment != 0)"
  };
}

message RegisterDeviceResponse {}
