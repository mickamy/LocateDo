syntax = "proto3";

package locatedo.account.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "locatedo/device/v1/device.proto";

service AccountService {
  rpc SignInWithApple(SignInWithAppleRequest) returns (SignInWithAppleResponse);
  rpc SignInWithGoogle(SignInWithGoogleRequest) returns (SignInWithGoogleResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  // Revokes the caller's refresh token family. Succeeds for an unknown or already revoked token.
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  // Deletes the account signed in with the token, for the web page that lets
  // people delete their account without the app. Never creates an account.
  rpc DeleteAccountWithApple(DeleteAccountWithAppleRequest) returns (DeleteAccountWithAppleResponse);
  rpc DeleteAccountWithGoogle(DeleteAccountWithGoogleRequest) returns (DeleteAccountWithGoogleResponse);
  // Re-reads the caller's subscription and updates their household plan in the background.
  // Call it after linking the purchase SDK to the user, since a purchase made before
  // signing in sends no webhook naming the user.
  rpc SyncEntitlement(SyncEntitlementRequest) returns (SyncEntitlementResponse);
}

message Session {
  string user_id = 1;
  string access_token = 2;
  google.protobuf.Timestamp access_token_expires_at = 3;
  string refresh_token = 4;
  bool new_user = 5;
}

// The client Apple issued the identity token and authorization code to.
enum AppleClient {
  // The app's Bundle ID, as the iOS app signs in.
  APPLE_CLIENT_UNSPECIFIED = 0;
  // The Services ID, as the Android app signs in through Apple's web sign-in.
  APPLE_CLIENT_SERVICES = 1;
}

message SignInWithAppleRequest {
  string identity_token = 1 [(buf.validate.field).string.min_len = 1];
  optional string display_name = 2 [(buf.validate.field).string.max_len = 100];
  string authorization_code = 3 [(buf.validate.field).string.min_len = 1];
  string nonce = 4 [(buf.validate.field).string = {
    min_len: 16
    max_len: 128
  }];
  AppleClient client = 5 [(buf.validate.field).enum.defined_only = true];
}

message SignInWithAppleResponse {
  Session session = 1;
  // Set when the user already belongs to a household; the device adopts it instead of creating one.
  optional string household_id = 2;
}

message SignInWithGoogleRequest {
  string id_token = 1 [(buf.validate.field).string.min_len = 1];
  string nonce = 2 [(buf.validate.field).string = {
    min_len: 16
    max_len: 128
  }];
}

message SignInWithGoogleResponse {
  Session session = 1;
  // Set when the user already belongs to a household; the device adopts it instead of creating one.
  optional string household_id = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message RefreshTokenResponse {
  Session session = 1;
  optional string household_id = 2;
}

message SignOutRequest {
  message Device {
    locatedo.device.v1.Platform platform = 1 [(buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }];
    // The value the device registered: an APNs device token or a Firebase installation ID.
    string push_token = 2 [(buf.validate.field).string = {
      min_len: 1
      max_len: 4096
    }];
  }

  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
  // Set when the device is registered for push. If the registration belongs to
  // the token's owner, it is detached from them while it consents to promotions
  // and removed otherwise.
  Device device = 2;
}

message SignOutResponse {}

message DeleteAccountRequest {}

message DeleteAccountResponse {}

message DeleteAccountWithAppleRequest {
  // Issued to the web Services ID.
  string identity_token = 1 [(buf.validate.field).string.min_len = 1];
  string nonce = 2 [(buf.validate.field).string = {
    min_len: 16
    max_len: 128
  }];
}

message DeleteAccountWithAppleResponse {
  // False when no account is linked to the token.
  bool deleted = 1;
}

message DeleteAccountWithGoogleRequest {
  string id_token = 1 [(buf.validate.field).string.min_len = 1];
  string nonce = 2 [(buf.validate.field).string = {
    min_len: 16
    max_len: 128
  }];
}

message DeleteAccountWithGoogleResponse {
  // False when no account is linked to the token.
  bool deleted = 1;
}

message SyncEntitlementRequest {}

message SyncEntitlementResponse {}
