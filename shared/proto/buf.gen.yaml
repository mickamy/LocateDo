version: v2
inputs:
  - directory: .
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/mickamy/LocateDo/internal/gen
clean: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: ../../server/internal/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.21.0
    out: ../../server/internal/gen
    opt: paths=source_relative
  - remote: buf.build/apple/swift:v1.38.1
    out: ../../ios/LocateDo/Generated
    opt:
      - Visibility=Internal
  - remote: buf.build/connectrpc/swift:v1.2.3
    out: ../../ios/LocateDo/Generated
    opt:
      - Visibility=Internal
      - GenerateAsyncMethods=true
      - GenerateCallbackMethods=false
