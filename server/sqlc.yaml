version: "2"
overrides:
  go:
    overrides:
      - db_type: "uuid"
        go_type:
          import: "uuid"
          type: "UUID"
      - db_type: "uuid"
        nullable: true
        go_type:
          import: "uuid"
          type: "UUID"
          pointer: true
      - db_type: "timestamptz"
        go_type: "time.Time"
      - db_type: "timestamptz"
        nullable: true
        go_type:
          import: "time"
          type: "Time"
          pointer: true
      - db_type: "text"
        nullable: true
        go_type:
          type: "string"
          pointer: true
sql:
  - engine: "postgresql"
    schema: "internal/infra/storage/db/migrate/sql"
    queries: "internal/feature/account/queries/account_queries.sql"
    gen:
      go:
        package: "queries"
        out: "internal/feature/account/queries"
        sql_package: "pgx/v5"
        omit_unused_structs: true
  - engine: "postgresql"
    schema: "internal/infra/storage/db/migrate/sql"
