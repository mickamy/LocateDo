name: android-play

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-play.yml"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      metadata_only:
        description: Upload only the store listing (text and images) without building or uploading a release
        type: boolean
        default: false

concurrency:
  group: android-play
  cancel-in-progress: false

permissions: {}

jobs:
  beta:
    name: fastlane beta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-prod
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: java
          cache: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          working-directory: android
      - run: bundle install
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: ${{ !inputs.metadata_only }}
        with:
          validate-wrappers: true
          cache-disabled: true
      - name: Write the Firebase config, keystore, and Maps key
        if: ${{ !inputs.metadata_only }}
        run: |
          mkdir -p app/src/release credentials
          printf '%s' "${GOOGLE_SERVICES_JSON:?}" | base64 --decode > app/src/release/google-services.json
          printf '%s' "${KEYSTORE:?}" | base64 --decode > credentials/upload.jks
          if [ -n "$MAPS_API_KEY" ]; then
            printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY" > local.properties
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          MAPS_API_KEY: ${{ secrets.ANDROID_MAPS_API_KEY }}
      - run: bundle exec fastlane beta
        if: ${{ !inputs.metadata_only }}
        env:
          CI: "true"
          ORG_GRADLE_PROJECT_LOCATEDO_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      - run: bundle exec fastlane metadata
        env:
          CI: "true"
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
