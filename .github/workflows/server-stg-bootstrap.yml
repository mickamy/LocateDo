# One-off: the last job the Pi's self-hosted runner takes. It registers the Pi with SSM as a hybrid node, installs
# the AWS CLI the deploy script uses, removes the old staging stack, and stops the runner. Runs when this file is
# pushed to dev; delete the file once it has passed.
name: server-stg-bootstrap

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/server-stg-bootstrap.yml"

concurrency:
  group: server-stg
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: self-hosted
    environment: server-stg
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Check the host
        run: |
          if ! sudo -n true 2>/dev/null; then
            echo "::error::passwordless sudo is unavailable; register the Pi by hand"
            exit 1
          fi
          arch=$(uname -m)
          if [ "${arch}" != aarch64 ]; then
            echo "::error::expected aarch64, got ${arch}"
            exit 1
          fi
          . /etc/os-release
          echo "${PRETTY_NAME} (${arch})"
          docker compose version

      - name: Register with SSM
        env:
          ACTIVATION_ID: ${{ secrets.SSM_ACTIVATION_ID }}
          ACTIVATION_CODE: ${{ secrets.SSM_ACTIVATION_CODE }}
        run: |
          if [ -z "${ACTIVATION_ID}" ] || [ -z "${ACTIVATION_CODE}" ]; then
            echo "::error::SSM_ACTIVATION_ID and SSM_ACTIVATION_CODE must be set in server-stg"
            exit 1
          fi
          work=$(mktemp -d)
          trap 'rm -rf "${work}"' EXIT
          curl -fsSL -o "${work}/amazon-ssm-agent.deb" \
            https://s3.us-west-2.amazonaws.com/amazon-ssm-us-west-2/latest/debian_arm64/amazon-ssm-agent.deb
          sudo dpkg -i "${work}/amazon-ssm-agent.deb"
          sudo systemctl stop amazon-ssm-agent
          sudo amazon-ssm-agent -register -code "${ACTIVATION_CODE}" -id "${ACTIVATION_ID}" -region us-west-2 -y
          sudo systemctl enable --now amazon-ssm-agent

      - name: Install the AWS CLI
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "${work}"' EXIT
          if ! command -v unzip >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq unzip
          fi
          curl -fsSL -o "${work}/awscliv2.zip" https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip
          unzip -q "${work}/awscliv2.zip" -d "${work}"
          sudo "${work}/aws/install" --update
          aws --version

      # Staging's data is disposable; the first deploy starts from an empty database.
      - name: Remove the old staging stack
        run: |
          sudo docker compose -p server down -v --remove-orphans
          sudo docker image prune -af

      # A delay keeps the runner alive long enough to report this job's result.
      - name: Stop the runner after this job
        run: |
          sudo systemd-run --unit locatedo-stop-runner --on-active=120 \
            /bin/sh -c "systemctl disable --now 'actions.runner.*'"
