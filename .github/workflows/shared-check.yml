name: shared-check

on:
  pull_request:
    paths:
      - "shared/**"
      - "tools/l10n/**"
      - "server/internal/gen/**"
      - "ios/LocateDo/Localizable.xcstrings"
      - "ios/LocateDo/InfoPlist.xcstrings"
      - ".github/workflows/shared-check.yml"
  push:
    branches: [main, dev]
    paths:
      - "shared/**"
      - "tools/l10n/**"
      - "server/internal/gen/**"
      - "ios/LocateDo/Localizable.xcstrings"
      - "ios/LocateDo/InfoPlist.xcstrings"
      - ".github/workflows/shared-check.yml"
  workflow_dispatch:

jobs:
  proto:
    name: buf lint / breaking / generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          input: shared/proto
          lint: true
          format: true
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#format=git,commit=${{ github.event.pull_request.base.sha }},subdir=shared/proto
          push: false
          archive: false
      - name: Check generated code is current
        working-directory: shared/proto
        run: |
          buf generate
          git -C ../.. add -N server/internal/gen
          git -C ../.. diff --exit-code --stat -- server/internal/gen

  strings:
    name: l10n check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/l10n/go.mod
          cache-dependency-path: tools/l10n/go.sum
      - run: make -C tools/l10n test
      - run: make -C tools/l10n lint
      - run: make -C tools/l10n check
