name: shared-ci

on:
  pull_request:
    paths:
      - "shared/**"
      - "tools/l10n/**"
      - "server/internal/gen/**"
      - "ios/LocateDo/Localizable.xcstrings"
      - "ios/LocateDo/InfoPlist.xcstrings"
      - "ios/LocateDo/Generated/**"
      - "android/app/src/main/generated/**"
      - "android/app/src/main/res/values*/strings.xml"
      - "tools/analytics/catalog/**"
      - "tools/analytics/ga4_definitions.json"
      - "tools/analytics/bigquery/00_events.sql"
      - "ios/LocateDo/Services/Analytics/AnalyticsCatalog.swift"
      - "android/app/src/main/java/com/locatedo/locatedo/core/analytics/AnalyticsCatalog.kt"
      - ".github/workflows/shared-ci.yml"
  push:
    branches: [main, dev]
    paths:
      - "shared/**"
      - "tools/l10n/**"
      - "server/internal/gen/**"
      - "ios/LocateDo/Localizable.xcstrings"
      - "ios/LocateDo/InfoPlist.xcstrings"
      - "ios/LocateDo/Generated/**"
      - "android/app/src/main/generated/**"
      - "android/app/src/main/res/values*/strings.xml"
      - "tools/analytics/catalog/**"
      - "tools/analytics/ga4_definitions.json"
      - "tools/analytics/bigquery/00_events.sql"
      - "ios/LocateDo/Services/Analytics/AnalyticsCatalog.swift"
      - "android/app/src/main/java/com/locatedo/locatedo/core/analytics/AnalyticsCatalog.kt"
      - ".github/workflows/shared-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A pull request from dev skips the l10n check: the push to dev has already run it on the same commits. The
# proto job still runs, since only a pull request checks for breaking changes against its base.
jobs:
  proto:
    name: buf lint / breaking / generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: buf
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          input: shared/proto
          lint: true
          format: true
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#format=git,commit=${{ github.event.pull_request.base.sha }},subdir=shared/proto
          push: false
          archive: false
          pr_comment: false
      - name: Check generated code is current
        working-directory: shared/proto
        run: |
          buf generate
          git -C ../.. add -N server/internal/gen ios/LocateDo/Generated android/app/src/main/generated
          git -C ../.. diff --exit-code --stat -- server/internal/gen ios/LocateDo/Generated android/app/src/main/generated

  strings:
    name: l10n check
    if: github.event_name != 'pull_request' || github.head_ref != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: golangci-lint
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/l10n/go.mod
          cache-dependency-path: tools/l10n/go.sum
      - run: make -C tools/l10n test
      - run: make -C tools/l10n lint
      - run: make -C tools/l10n check

  analytics:
    name: analytics catalog check
    if: github.event_name != 'pull_request' || github.head_ref != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: golangci-lint
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/analytics/catalog/go.mod
          cache-dependency-path: tools/analytics/catalog/go.sum
      - run: make -C tools/analytics/catalog test
      - run: make -C tools/analytics/catalog lint
      - run: make -C tools/analytics/catalog check
