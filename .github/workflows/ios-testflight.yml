name: ios-testflight

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  beta:
    name: fastlane beta
    # Enable with `gh variable set TESTFLIGHT_ENABLED --body true` once the Apple Developer Program is active.
    if: vars.TESTFLIGHT_ENABLED == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          working-directory: ios
          bundler-cache: true
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
      - name: Write GoogleService-Info.plist
        run: |
          mkdir -p LocateDo/Firebase
          printf '%s' "$GOOGLE_SERVICE_INFO" | base64 --decode > LocateDo/Firebase/GoogleService-Info-Release.plist
        working-directory: ios
        env:
          GOOGLE_SERVICE_INFO: ${{ secrets.FIREBASE_GOOGLE_SERVICE_INFO_RELEASE }}
      - run: bundle exec fastlane beta
        working-directory: ios
        env:
          CI: "true"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
