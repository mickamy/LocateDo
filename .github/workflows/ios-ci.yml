name: ios-ci

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: xcodebuild test
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      SIMULATOR: iPhone 17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Boot the simulator while building
        run: xcrun simctl boot "$SIMULATOR" || true
      - id: xcode
        run: echo "version=$(xcodebuild -version | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: DerivedData
          key: ios-dd-v1-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/LocateDo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ios-dd-v1-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/LocateDo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            ios-dd-v1-${{ steps.xcode.outputs.version }}-
      - name: Build for testing
        id: build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project ios/LocateDo.xcodeproj \
            -scheme dev \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project ios/LocateDo.xcodeproj \
            -scheme dev \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            -derivedDataPath DerivedData \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            | xcbeautify --renderer github-actions
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
      - name: Drop logs from the cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.build.outcome == 'success' }}
        run: rm -rf DerivedData/Logs
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() && github.event_name == 'push' && steps.build.outcome == 'success' }}
        with:
          path: DerivedData
          key: ios-dd-v1-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/LocateDo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}

  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - run: swiftlint lint --strict --reporter github-actions-logging
        working-directory: ios
