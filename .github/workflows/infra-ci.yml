name: infra-ci

on:
  pull_request:
    paths:
      - deploy/**
      - .mise.toml
      - .github/workflows/infra-ci.yml
  push:
    branches:
      - main
    paths:
      - deploy/**
      - .mise.toml
      - .github/workflows/infra-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: fmt / validate (${{ matrix.root }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        root:
          - prod
          - bootstrap
          - persistent
    defaults:
      run:
        working-directory: deploy/tofu/${{ matrix.root }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: opentofu
      - run: tofu fmt -check -diff
      - run: tofu init -backend=false -input=false -lockfile=readonly
      - run: tofu validate
