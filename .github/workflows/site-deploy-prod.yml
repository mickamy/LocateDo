name: site-deploy-prod

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site-deploy-prod.yml"
  workflow_dispatch:

concurrency:
  group: site-deploy-prod
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: wrangler pages deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: site-prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: node
      - run: npx --yes wrangler@4.147.0 pages deploy site --project-name locatedo --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
