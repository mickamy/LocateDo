name: server-set-plan-stg

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: Id of the household's owner (Settings > Debug > User on a Staging build)
        required: true
      plan:
        description: Plan to set
        required: true
        type: choice
        options:
          - pro
          - free

permissions:
  contents: read

concurrency:
  group: server-stg
  cancel-in-progress: false

jobs:
  set-plan:
    runs-on: ubuntu-latest
    environment: server-stg
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/locatedo-stg-deploy
          aws-region: us-west-2

      - name: Set the plan on the Pi
        env:
          USER_ID: ${{ inputs.user_id }}
          PLAN: ${{ inputs.plan }}
        run: |
          if [[ ! "${USER_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error::user_id must be a lowercase UUID"
            exit 1
          fi
          {
            printf 'export USER_ID=%q PLAN=%q\n' "${USER_ID}" "${PLAN}"
            cat server/scripts/set-plan-stg.sh
          } > set-plan.sh
          .github/scripts/run-on-stg.sh set-plan.sh "set plan ${PLAN} for ${USER_ID}"
