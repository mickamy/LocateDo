name: server-db-reset-stg

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "reset" to drop staging's database and start from an empty one
        required: true

permissions:
  contents: read

concurrency:
  group: server-stg
  cancel-in-progress: false

jobs:
  reset:
    if: inputs.confirm == 'reset'
    runs-on: ubuntu-latest
    environment: server-stg
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/locatedo-stg-deploy
          aws-region: us-west-2

      - name: Reset the database on the Pi
        run: .github/scripts/run-on-stg.sh server/scripts/reset-stg.sh "reset the database"
