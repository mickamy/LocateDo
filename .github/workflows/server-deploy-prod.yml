name: server-deploy-prod

on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit to deploy, short SHA allowed (defaults to the last successful server-image build on main)
        required: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    concurrency:
      group: server-prod
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Pick the image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.image_tag }}
        run: |
          if [ -n "${REQUESTED}" ]; then
            tag=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REQUESTED}" --jq .sha)
          else
            tag=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow server-image.yml --branch main \
              --status success --limit 1 --json headSha --jq '.[0].headSha')
          fi
          if [[ ! "${tag}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::no image to deploy (got '${tag}')"
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      # A release that also changes infrastructure (a log group, a permission) must
      # not start the new containers before that change is applied.
      - name: Wait for this commit's infrastructure apply
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          for _ in $(seq 1 60); do
            run=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow infra-apply-prod.yml --commit "${IMAGE_TAG}" \
              --limit 1 --json status,conclusion \
              --jq '.[0] | if . == null then "none" else "\(.status) \(.conclusion)" end')
            case "${run}" in
              none | "completed success") exit 0 ;;
              completed*)
                echo "::error::infra-apply-prod for this commit ended with ${run#completed }"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::infra-apply-prod for this commit did not finish in 10 minutes"
          exit 1

      # The Compose file and init script must come from the same commit as the image.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.image.outputs.tag }}
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that the image exists
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: docker buildx imagetools inspect "ghcr.io/mickamy/locatedo-server:${IMAGE_TAG}" >/dev/null

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/locatedo-prod-deploy
          aws-region: us-west-2

      - name: Write app settings to Parameter Store
        env:
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          SEAL_KEY: ${{ secrets.SEAL_KEY }}
          APPLE_BUNDLE_ID: com.locatedo.LocateDo
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          APNS_TOPIC: com.locatedo.LocateDo
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          REVENUECAT_PROJECT_ID: proj593408b8
          REVENUECAT_ENTITLEMENT_ID: entlf8b9ff89f9
          REVENUECAT_WEBHOOK_AUTH: ${{ secrets.REVENUECAT_WEBHOOK_AUTH }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          for name in JWT_SIGNING_KEY SEAL_KEY APPLE_BUNDLE_ID APPLE_TEAM_ID APPLE_KEY_ID APPLE_PRIVATE_KEY \
            APNS_KEY_ID APNS_PRIVATE_KEY APNS_TOPIC REVENUECAT_API_KEY REVENUECAT_PROJECT_ID \
            REVENUECAT_ENTITLEMENT_ID REVENUECAT_WEBHOOK_AUTH CLOUDFLARE_TUNNEL_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is empty"
              exit 1
            fi
            aws ssm put-parameter --name "/locatedo/prod/app/${name}" --type SecureString \
              --value "${!name}" --overwrite >/dev/null
          done

      - name: Run the deploy script on the instance
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          instance_id=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=locatedo-prod-app Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -z "${instance_id}" ]; then
            echo "::error::no running locatedo-prod-app instance"
            exit 1
          fi

          {
            printf 'export IMAGE_TAG=%q GHCR_USER=%q GHCR_TOKEN=%q\n' "${IMAGE_TAG}" "${GHCR_USER}" "${GHCR_TOKEN}"
            bundle=$(tar -cz -C server compose.prod.yaml initdb scripts/backup-prod.sh scripts/patch-prod.sh systemd cloudwatch | base64 -w0)
            printf 'export BUNDLE_B64=%q\n' "${bundle}"
            cat server/scripts/deploy-prod.sh
          } > deploy.sh
          jq -n --rawfile script deploy.sh '{commands: [$script], executionTimeout: ["900"]}' > parameters.json

          command_id=$(aws ssm send-command --instance-ids "${instance_id}" \
            --document-name AWS-RunShellScript --parameters file://parameters.json \
            --comment "deploy ${IMAGE_TAG}" --query Command.CommandId --output text)

          status=Pending
          for _ in $(seq 1 180); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "${command_id}" --instance-id "${instance_id}" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "${status}" in
              Pending | InProgress | Delayed) ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "${command_id}" --instance-id "${instance_id}" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          if [ "${status}" != Success ]; then
            echo "::error::deploy finished with ${status}"
            exit 1
          fi
