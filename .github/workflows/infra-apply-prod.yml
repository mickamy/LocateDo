name: infra-apply-prod

on:
  workflow_dispatch:
    inputs:
      action:
        description: plan only, or plan and then apply after approval
        required: true
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: infra-apply-prod
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: deploy/tofu/prod

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/locatedo-tofu-prod-plan
          aws-region: us-west-2

      - run: tofu init -input=false

      - name: Plan
        run: |
          tofu plan -input=false -no-color -out=tfplan | tee plan.txt
          {
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - if: inputs.action != 'plan'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan
          path: deploy/tofu/prod/tfplan
          retention-days: 1

  apply:
    needs: plan
    if: inputs.action != 'plan'
    runs-on: ubuntu-latest
    environment: prod-infra
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: deploy/tofu/prod

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/locatedo-tofu-prod
          aws-region: us-west-2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan
          path: deploy/tofu/prod

      - run: tofu init -input=false

      - name: Apply the reviewed plan
        run: tofu apply -input=false tfplan
