name: android-ci

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches: [main, dev]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: android

permissions:
  contents: read

# A pull request from dev skips these jobs: the push to dev has already run them on the same commits.
jobs:
  build:
    name: gradle lint and test
    if: github.event_name != 'pull_request' || github.head_ref != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: java
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
      - run: ./gradlew lint testDebugUnitTest
